[package]
name = "atlas-benchmarks"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
resolver = "2"

members = [
    "crates/atlas-constants",
    "crates/atlas-arrow",
    "crates/atlas-linalg",
    "crates/atlas-ml",
    "crates/atlas-ndarray",
    "crates/atlas-python",
    "crates/atlas-polars",
    "crates/atlas-random",
    "crates/atlas-stats",
]

[workspace.package]
edition = "2024"
rust-version = "1.85.0"
version = "0.1.0"

[workspace.dependencies]
atlas-linalg = { path = "crates/atlas-linalg" }
atlas-ml = { path = "crates/atlas-ml" }
atlas-arrow = { path = "crates/atlas-arrow" }
arrow-array = "53"
arrow-schema = "53"
polars = { version = "0.50", default-features = false }
polars-arrow = "0.50"
pyo3 = { version = "0.29", features = ["extension-module"] }
atlas-ndarray = { path = "crates/atlas-ndarray" }
atlas-polars = { path = "crates/atlas-polars" }
atlas-random = { path = "crates/atlas-random" }
atlas-stats = { path = "crates/atlas-stats" }
criterion = "0.5"
num-traits = "0.2"
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
thiserror = "2"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[dependencies]
atlas-ndarray.workspace = true

[dev-dependencies]
atlas-arrow.workspace = true
atlas-linalg.workspace = true
atlas-ml.workspace = true
atlas-random.workspace = true
atlas-stats.workspace = true
atlas-polars.workspace = true
criterion.workspace = true

[lints]
workspace = true

[[bench]]
name = "ndarray_contiguous_kernels"
harness = false
path = "benches/ndarray/contiguous_kernels.rs"

[[bench]]
name = "ndarray_view_kernels"
harness = false
path = "benches/ndarray/view_kernels.rs"

[[bench]]
name = "linalg_dense_kernels"
harness = false
path = "benches/linalg/dense_kernels.rs"

[[bench]]
name = "linalg_batched_kernels"
harness = false
path = "benches/linalg/batched_kernels.rs"

[[bench]]
name = "linalg_factorization_kernels"
harness = false
path = "benches/linalg/factorization_kernels.rs"

[[bench]]
name = "ml_baselines"
harness = false
path = "benches/ml/baselines.rs"

[[bench]]
name = "stats_descriptive_kernels"
harness = false
path = "benches/stats/descriptive_kernels.rs"

[[bench]]
name = "random_sampling_kernels"
harness = false
path = "benches/random/sampling_kernels.rs"
