[package]
name = "atlas-benchmarks"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
resolver = "2"

members = [
    "crates/atlas-constants",
    "crates/atlas-linalg",
    "crates/atlas-ndarray",
    "crates/atlas-random",
    "crates/atlas-stats",
]

[workspace.dependencies]

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[dependencies]
atlas-ndarray = { path = "crates/atlas-ndarray" }

[dev-dependencies]
atlas-linalg = { path = "crates/atlas-linalg" }
criterion = "0.5"

[lints]
workspace = true

[[bench]]
name = "ndarray_contiguous_kernels"
harness = false
path = "benches/ndarray/contiguous_kernels.rs"

[[bench]]
name = "linalg_dense_kernels"
harness = false
path = "benches/linalg/dense_kernels.rs"
