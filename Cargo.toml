[package]
name = "atlas-benchmarks"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
resolver = "2"

members = [
    "crates/atlas-constants",
    "crates/atlas-linalg",
    "crates/atlas-ndarray",
    "crates/atlas-random",
    "crates/atlas-stats",
]

[workspace.package]
edition = "2024"
rust-version = "1.85.0"
version = "0.1.0"

[workspace.dependencies]
atlas-linalg = { path = "crates/atlas-linalg" }
atlas-ndarray = { path = "crates/atlas-ndarray" }
atlas-random = { path = "crates/atlas-random" }
atlas-stats = { path = "crates/atlas-stats" }
criterion = "0.5"
num-traits = "0.2"
rand = "0.8"
rand_distr = "0.4"
thiserror = "2"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[dependencies]
atlas-ndarray.workspace = true

[dev-dependencies]
atlas-linalg.workspace = true
atlas-random.workspace = true
atlas-stats.workspace = true
criterion.workspace = true

[lints]
workspace = true

[[bench]]
name = "ndarray_contiguous_kernels"
harness = false
path = "benches/ndarray/contiguous_kernels.rs"

[[bench]]
name = "linalg_dense_kernels"
harness = false
path = "benches/linalg/dense_kernels.rs"
